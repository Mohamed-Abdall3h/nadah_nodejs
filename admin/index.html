<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>نبض ليبيا | لوحة الإدارة</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#10204b}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#071333,#18357e)}.box{background:#fff;padding:32px;border-radius:22px;width:min(430px,92vw);box-shadow:0 25px 70px #0005}.input{width:100%;padding:13px;margin:7px 0;border:1px solid #dfe4ef;border-radius:12px}.btn{border:0;border-radius:12px;padding:11px 17px;background:#ff8a00;color:#fff;font-weight:700;cursor:pointer}.app{display:none}.side{position:fixed;right:0;top:0;bottom:0;width:240px;background:#091a49;color:white;padding:22px}.side button{display:block;width:100%;padding:12px;margin:6px 0;background:transparent;border:0;color:white;text-align:right;border-radius:10px;cursor:pointer}.side button.active,.side button:hover{background:#193477}.main{margin-right:240px;padding:28px;max-width:1400px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.stat,.card{background:white;border-radius:18px;padding:18px;box-shadow:0 5px 22px #10204b0d}.stat b{display:block;font-size:28px;margin-top:8px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.table{width:100%;border-collapse:collapse;background:white;border-radius:16px;overflow:hidden}.table th,.table td{padding:12px;border-bottom:1px solid #eef0f5;text-align:right}.danger{background:#d92d20}.ghost{background:#eef2f8;color:#10204b}.form{display:grid;gap:10px}.form textarea{min-height:130px}.hide{display:none}.msg{margin-top:10px;color:#c62828}
@media(max-width:760px){.side{position:static;width:100%;height:auto;display:flex;overflow:auto;gap:5px}.side h2{display:none}.side button{min-width:max-content}.main{margin-right:0;padding:15px}}
</style></head>
<body>
<div id="login" class="login"><div class="box"><h1>نبض ليبيا</h1><p>دخول المشرف</p>
<input id="email" class="input" value="admin@gmail.com" placeholder="البريد الإلكتروني">
<input id="password" class="input" type="password" value="123456" placeholder="كلمة المرور">
<button class="btn" onclick="login()">دخول</button><div id="loginMsg" class="msg"></div></div></div>
<div id="app" class="app"><aside class="side"><h2>نبض ليبيا</h2>
<button onclick="page('dashboard')" class="active">📊 الرئيسية</button><button onclick="page('articles')">📰 الأخبار</button><button onclick="page('videos')">🎬 الفيديوهات</button><button onclick="page('notifications')">🔔 الإشعارات</button><button onclick="page('users')">👥 المستخدمون</button><button onclick="page('categories')">🗂️ الأقسام</button><button onclick="page('sources')">📡 المصادر</button><button onclick="logout()">خروج</button></aside>
<main class="main"><div class="top"><h1 id="title">الرئيسية</h1><span id="status"></span></div><div id="content"></div></main></div>
<script>
let token=localStorage.getItem('nabdh_admin_token'); const $=id=>document.getElementById(id);
async function api(path,opt={}){opt.headers=Object.assign({'Content-Type':'application/json','Authorization':'Bearer '+token},opt.headers||{});let r=await fetch('/api/admin'+path,opt);let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'حدث خطأ');return d}
async function login(){try{let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});let d=await r.json();if(!r.ok)throw Error(d.error);if(d.user.role!=='admin')throw Error('الحساب ليس مشرفاً');token=d.token;localStorage.setItem('nabdh_admin_token',token);$('login').style.display='none';$('app').style.display='block';page('dashboard')}catch(e){$('loginMsg').textContent=e.message}}
function logout(){localStorage.removeItem('nabdh_admin_token');location.reload()}
async function page(p){document.querySelectorAll('.side button').forEach(b=>b.classList.remove('active'));$('title').textContent={dashboard:'الرئيسية',articles:'الأخبار',videos:'الفيديوهات',notifications:'الإشعارات',users:'المستخدمون',categories:'الأقسام',sources:'المصادر'}[p];try{if(p==='dashboard')return dashboard();if(p==='articles')return articles();if(p==='videos')return videos();if(p==='notifications')return notifications();if(p==='users')return users();if(p==='categories')return simple('/categories','الأقسام');if(p==='sources')return simple('/sources','المصادر')}catch(e){$('content').innerHTML='<div class="card">'+e.message+'</div>'}}
async function dashboard(){let s=await api('/stats');$('content').innerHTML='<div class="grid">'+[['المستخدمون',s.users],['الأخبار',s.articles],['Premium',s.premiumUsers],['المفضلة',s.favorites],['المحفوظات',s.saved],['الإيرادات',s.revenue]].map(x=>`<div class="stat">${x[0]}<b>${x[1]}</b></div>`).join('')+'</div><div class="card" style="margin-top:16px"><h3>حالة النظام</h3><p>Backend وDashboard متصلان بنجاح.</p></div>'}
function esc(x){return String(x??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
async function articles(){let d=await api('/articles');$('content').innerHTML='<div class="toolbar"><button class="btn" onclick="newArticle()">+ خبر جديد</button></div><table class="table"><tr><th>العنوان</th><th>القسم</th><th>عاجل</th><th>مميز</th><th>إجراء</th></tr>'+d.articles.map(a=>`<tr><td>${esc(a.title)}</td><td>${esc(a.category_name||a.categoryName)}</td><td>${a.isBreaking?'نعم':'لا'}</td><td>${a.isFeatured?'نعم':'لا'}</td><td><button class="btn danger" onclick="del('/articles/${a.id}',articles)">حذف</button></td></tr>`).join('')+'</table>'}
function newArticle(){ $('content').innerHTML='<div class="card form"><input id="at" class="input" placeholder="عنوان الخبر"><textarea id="ab" class="input" placeholder="نص الخبر"></textarea><input id="ac" class="input" placeholder="categoryKey مثال politics"><input id="an" class="input" placeholder="اسم القسم"><input id="ai" class="input" placeholder="رابط الصورة"><label><input id="abr" type="checkbox"> عاجل</label><label><input id="afe" type="checkbox"> مميز</label><button class="btn" onclick="saveArticle()">حفظ</button></div>'}
async function saveArticle(){await api('/articles',{method:'POST',body:JSON.stringify({title:$('at').value,body:$('ab').value,categoryKey:$('ac').value,categoryName:$('an').value,imageUrl:$('ai').value,isBreaking:$('abr').checked,isFeatured:$('afe').checked})});articles()}
async function videos(){let d=await api('/videos');$('content').innerHTML='<div class="toolbar"><button class="btn" onclick="newVideo()">+ فيديو/رابط</button></div><table class="table"><tr><th>العنوان</th><th>الرابط</th><th>إجراء</th></tr>'+d.videos.map(v=>`<tr><td>${esc(v.title)}</td><td><a href="${esc(v.url)}" target="_blank">فتح الرابط</a></td><td><button class="btn danger" onclick="del('/videos/${v.id}',videos)">حذف</button></td></tr>`).join('')+'</table>'}
function newVideo(){$('content').innerHTML='<div class="card form"><input id="vt" class="input" placeholder="عنوان الفيديو"><textarea id="vd" class="input" placeholder="الوصف"></textarea><input id="vu" class="input" placeholder="رابط YouTube / Facebook / TikTok / Vimeo أو رابط مباشر"><input id="vth" class="input" placeholder="رابط الصورة المصغرة (اختياري)"><input id="vc" class="input" placeholder="categoryKey اختياري"><button class="btn" onclick="saveVideo()">حفظ الفيديو</button></div>'}
async function saveVideo(){await api('/videos',{method:'POST',body:JSON.stringify({title:$('vt').value,description:$('vd').value,url:$('vu').value,thumbnailUrl:$('vth').value,categoryKey:$('vc').value})});videos()}
async function notifications(){let d=await api('/notifications');$('content').innerHTML='<div class="toolbar"><button class="btn" onclick="newNotification()">+ إرسال إشعار</button></div><table class="table"><tr><th>العنوان</th><th>النص</th><th>التاريخ</th></tr>'+d.notifications.map(n=>`<tr><td>${esc(n.title)}</td><td>${esc(n.body)}</td><td>${esc(n.created_at)}</td></tr>`).join('')+'</table>'}
function newNotification(){$('content').innerHTML='<div class="card form"><input id="nt" class="input" placeholder="عنوان الإشعار"><textarea id="nb" class="input" placeholder="نص الإشعار"></textarea><input id="na" class="input" placeholder="معرف الخبر (اختياري)"><button class="btn" onclick="saveNotification()">إرسال</button></div>'}
async function saveNotification(){await api('/notifications',{method:'POST',body:JSON.stringify({title:$('nt').value,body:$('nb').value,articleId:$('na').value||null})});notifications()}
async function users(){let d=await api('/users');$('content').innerHTML='<table class="table"><tr><th>الاسم</th><th>البريد</th><th>الدور</th><th>Premium</th></tr>'+d.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${u.role}</td><td>${u.isPremium?'نعم':'لا'}</td></tr>`).join('')+'</table>'}
async function simple(path,label){let d=await api(path);let key=label==='الأقسام'?'categories':'sources';$('content').innerHTML='<div class="card"><h3>'+label+'</h3>'+d[key].map(x=>`<p><b>${esc(x.name)}</b> — ${esc(x.type||x.id)}</p>`).join('')+'</div>'}
async function del(path,fn){if(confirm('تأكيد الحذف؟')){await api(path,{method:'DELETE'});fn()}}
if(token){$('login').style.display='none';$('app').style.display='block';page('dashboard')}
</script></body></html>
