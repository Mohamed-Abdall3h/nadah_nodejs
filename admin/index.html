<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نبض ليبيا | لوحة التحكم</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#0d1b45}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#060e2e,#162b75)}.box{background:#fff;padding:32px;border-radius:22px;width:min(420px,92vw);box-shadow:0 25px 70px #0004}.box h1{margin-top:0}.input{width:100%;padding:13px;margin:7px 0;border:1px solid #e1e5ef;border-radius:12px}.btn{border:0;border-radius:12px;padding:12px 18px;background:#ff8c00;color:#fff;font-weight:700;cursor:pointer}.app{display:none;min-height:100vh}.side{position:fixed;right:0;top:0;bottom:0;width:235px;background:#0b1d51;color:#fff;padding:24px}.side button{display:block;width:100%;padding:13px;margin:7px 0;background:transparent;border:0;color:#fff;text-align:right;border-radius:10px;cursor:pointer}.side button:hover{background:#ffffff15}.main{margin-right:235px;padding:28px}.top{display:flex;justify-content:space-between;align-items:center}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:22px 0}.card{background:#fff;padding:20px;border-radius:16px;box-shadow:0 6px 20px #0b1d5110}.num{font-size:28px;font-weight:900}.panel{background:#fff;border-radius:16px;padding:18px;overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #eee;text-align:right;white-space:nowrap}.tag{padding:5px 8px;border-radius:8px;background:#eef2ff}.danger{background:#e53935}.muted{color:#6b7a9e}.hidden{display:none}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.toolbar input{padding:10px;border:1px solid #ddd;border-radius:10px}.small{padding:7px 10px;font-size:12px}@media(max-width:900px){.side{position:static;width:100%}.main{margin:0}.cards{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<div id="login" class="login"><div class="box"><h1>نبض ليبيا</h1><p class="muted">دخول لوحة تحكم المشرف</p><input id="email" class="input" value="admin@gmail.com" placeholder="البريد"><input id="pass" class="input" type="password" value="123456" placeholder="كلمة المرور"><button class="btn" style="width:100%;margin-top:10px" onclick="login()">دخول</button><p id="err" style="color:#e53935"></p></div></div>
<div id="app" class="app"><aside class="side"><h2>نبض ليبيا</h2><button onclick="show('home')">📊 الرئيسية</button><button onclick="show('articles')">📰 الأخبار</button><button onclick="show('users')">👥 المستخدمون</button><button onclick="show('categories')">🗂️ التصنيفات</button><button onclick="show('sources')">📡 المصادر</button><button onclick="logout()">🚪 خروج</button></aside><main class="main"><div class="top"><div><h1 id="title">لوحة التحكم</h1><p class="muted">إدارة تطبيق نبض ليبيا</p></div></div><section id="home" class="view"><div id="cards" class="cards"></div><div class="panel"><h3>ملخص سريع</h3><p>من هنا تقدر تدير الأخبار والمستخدمين والمصادر والتصنيفات.</p></div></section><section id="articles" class="view hidden"><div class="panel"><div class="toolbar"><input id="articleSearch" placeholder="بحث في الأخبار" oninput="renderArticles()"><button class="btn" onclick="addArticle()">+ إضافة خبر</button></div><div id="articlesTable"></div></div></section><section id="users" class="view hidden"><div class="panel"><div id="usersTable"></div></div></section><section id="categories" class="view hidden"><div class="panel"><div class="toolbar"><button class="btn" onclick="addCategory()">+ تصنيف</button></div><div id="categoriesTable"></div></div></section><section id="sources" class="view hidden"><div class="panel"><div class="toolbar"><button class="btn" onclick="addSource()">+ مصدر</button></div><div id="sourcesTable"></div></div></section></main></div>
<script>
const A='/api/admin';let token=localStorage.getItem('nabdh_admin_token');let state={articles:[],users:[],categories:[],sources:[]};
async function api(path,opts={}){opts.headers={...(opts.headers||{}),'Content-Type':'application/json',Authorization:'Bearer '+token};const r=await fetch(A+path,opts);const d=await r.json();if(!r.ok)throw Error(d.error||'حدث خطأ');return d}
async function login(){try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:pass.value})});const d=await r.json();if(!r.ok||d.user.role!=='admin')throw Error('بيانات المشرف غير صحيحة');token=d.token;localStorage.setItem('nabdh_admin_token',token);openApp()}catch(e){err.textContent=e.message}}
function logout(){localStorage.removeItem('nabdh_admin_token');location.reload()}
async function openApp(){loginEl.style.display='none';app.style.display='block';await refresh();show('home')}
async function refresh(){try{const [s,a,u,c,so]=await Promise.all([api('/stats'),api('/articles'),api('/users'),api('/categories'),api('/sources')]);state={...state,...a,...u,...c,...so};cards.innerHTML=[['المستخدمون',s.users],['الأخبار',s.articles],['Premium',s.premiumUsers],['الإيرادات',s.revenue+' LYD']].map(x=>`<div class=card><div class=muted>${x[0]}</div><div class=num>${x[1]}</div></div>`).join('');renderAll()}catch(e){alert(e.message);logout()}}
function show(id){document.querySelectorAll('.view').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.getElementById('title').textContent={home:'لوحة التحكم',articles:'إدارة الأخبار',users:'المستخدمون',categories:'التصنيفات',sources:'المصادر'}[id]}
function renderAll(){renderArticles();usersTable.innerHTML='<table><tr><th>الاسم</th><th>البريد</th><th>الدور</th><th>Premium</th><th>إجراء</th></tr>'+state.users.map(u=>`<tr><td>${u.name}</td><td>${u.email}</td><td>${u.role}</td><td>${u.isPremium?'نعم':'لا'}</td><td><button class="btn small" onclick="togglePremium(${u.id},${!u.isPremium})">${u.isPremium?'إلغاء Premium':'تفعيل Premium'}</button></td></tr>`).join('')+'</table>';categoriesTable.innerHTML='<table><tr><th>المعرف</th><th>الاسم</th><th>اللون</th><th></th></tr>'+state.categories.map(c=>`<tr><td>${c.id}</td><td>${c.name}</td><td>${c.color}</td><td><button class="btn small danger" onclick="delCategory('${c.id}')">حذف</button></td></tr>`).join('')+'</table>';sourcesTable.innerHTML='<table><tr><th>المعرف</th><th>المصدر</th><th>النوع</th><th></th></tr>'+state.sources.map(s=>`<tr><td>${s.id}</td><td>${s.name}</td><td>${s.type}</td><td><button class="btn small danger" onclick="delSource('${s.id}')">حذف</button></td></tr>`).join('')+'</table>'}
function renderArticles(){let q=(articleSearch?.value||'').toLowerCase();let rows=state.articles.filter(a=>a.title.toLowerCase().includes(q));articlesTable.innerHTML='<table><tr><th>العنوان</th><th>التصنيف</th><th>عاجل</th><th>مميز</th><th></th></tr>'+rows.map(a=>`<tr><td>${a.title}</td><td>${a.category_name}</td><td>${a.isBreaking?'نعم':'لا'}</td><td>${a.isFeatured?'نعم':'لا'}</td><td><button class="btn small" onclick="editArticle('${a.id}')">تعديل</button> <button class="btn small danger" onclick="delArticle('${a.id}')">حذف</button></td></tr>`).join('')+'</table>'}
async function togglePremium(id,v){await api('/users/'+id,{method:'PATCH',body:JSON.stringify({isPremium:v})});refresh()} async function delArticle(id){if(confirm('حذف الخبر؟')){await api('/articles/'+id,{method:'DELETE'});refresh()}}async function editArticle(id){let a=state.articles.find(x=>x.id===id);let title=prompt('العنوان',a.title);if(title) {await api('/articles/'+id,{method:'PATCH',body:JSON.stringify({title})});refresh()}}async function addArticle(){let title=prompt('عنوان الخبر');if(!title)return;let categoryKey=prompt('معرف التصنيف',state.categories[0]?.id||'local');let categoryName=state.categories.find(c=>c.id===categoryKey)?.name||categoryKey;await api('/articles',{method:'POST',body:JSON.stringify({title,categoryKey,categoryName,isBreaking:false,isFeatured:false})});refresh()}
async function addCategory(){let id=prompt('المعرف (مثال: economy)');let name=prompt('اسم التصنيف');if(id&&name){await api('/categories',{method:'POST',body:JSON.stringify({id,name})});refresh()}}async function delCategory(id){if(confirm('حذف التصنيف؟')){await api('/categories/'+id,{method:'DELETE'});refresh()}}async function addSource(){let id=prompt('المعرف');let name=prompt('اسم المصدر');if(id&&name){await api('/sources',{method:'POST',body:JSON.stringify({id,name})});refresh()}}async function delSource(id){if(confirm('حذف المصدر؟')){await api('/sources/'+id,{method:'DELETE'});refresh()}}
const loginEl=document.getElementById('login');if(token)openApp();
</script></body></html>
