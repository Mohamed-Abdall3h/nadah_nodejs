<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نبض ليبيا | لوحة التحكم</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#0d1b45}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#060e2e,#162b75)}.box{background:#fff;padding:32px;border-radius:22px;width:min(430px,92vw);box-shadow:0 25px 70px #0004}.input{width:100%;padding:13px;margin:7px 0;border:1px solid #e1e5ef;border-radius:12px}.btn{border:0;border-radius:12px;padding:11px 16px;background:#ff8c00;color:#fff;font-weight:700;cursor:pointer}.btn.red{background:#e53935}.btn.blue{background:#1769aa}.app{display:none;min-height:100vh}.side{position:fixed;right:0;top:0;bottom:0;width:240px;background:#0b1d51;color:#fff;padding:22px}.side h2{margin:0 0 20px}.side button{display:block;width:100%;padding:13px;margin:6px 0;background:transparent;border:0;color:#fff;text-align:right;border-radius:10px;cursor:pointer}.side button:hover{background:#ffffff15}.main{margin-right:240px;padding:28px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}.card,.panel{background:#fff;border-radius:16px;padding:18px;box-shadow:0 6px 20px #0b1d5110}.num{font-size:28px;font-weight:900}.muted{color:#6b7a9e}.hidden{display:none}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.toolbar input,.toolbar textarea,.toolbar select{padding:11px;border:1px solid #ddd;border-radius:10px;min-width:180px}.toolbar textarea{min-height:80px}.full{width:100%}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #eee;text-align:right;vertical-align:top}.small{padding:7px 10px;font-size:12px}.tag{display:inline-block;padding:4px 7px;border-radius:8px;background:#eef2ff}@media(max-width:900px){.side{position:static;width:100%}.main{margin:0}.cards{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<div id="loginScreen" class="login"><div class="box"><h1>نبض ليبيا</h1><p class="muted">دخول لوحة تحكم المشرف</p><input id="email" class="input" value="admin@gmail.com"><input id="pass" class="input" type="password" value="123456"><button class="btn full" onclick="adminLogin()">دخول</button><p id="err" style="color:#e53935"></p></div></div>
<div id="app" class="app"><aside class="side"><h2>نبض ليبيا</h2><button onclick="show('home')">📊 الرئيسية</button><button onclick="show('articles')">📰 الأخبار</button><button onclick="show('videos')">🎬 الفيديوهات</button><button onclick="show('notifications')">🔔 الإشعارات</button><button onclick="show('users')">👥 المستخدمون</button><button onclick="show('categories')">🗂️ التصنيفات</button><button onclick="show('sources')">📡 المصادر</button><button onclick="logout()">🚪 خروج</button></aside><main class="main"><h1 id="title">لوحة التحكم</h1>
<section id="home" class="view"><div id="cards" class="cards"></div><div class="panel"><h3>الإدارة</h3><p class="muted">كل ما تضيفه هنا يظهر في التطبيق من خلال الـ API.</p></div></section>
<section id="articles" class="view hidden"><div class="panel"><div class="toolbar"><input id="articleSearch" placeholder="بحث" oninput="renderArticles()"><button class="btn" onclick="addArticle()">+ إضافة خبر</button></div><div id="articlesTable"></div></div></section>
<section id="videos" class="view hidden"><div class="panel"><div class="toolbar"><input id="videoTitle" placeholder="عنوان الفيديو"><input id="videoUrl" placeholder="رابط YouTube / فيديو"><input id="videoThumb" placeholder="Thumbnail اختياري"><input id="videoDesc" placeholder="وصف"><button class="btn" onclick="addVideo()">+ إضافة فيديو</button></div><div id="videosTable"></div></div></section>
<section id="notifications" class="view hidden"><div class="panel"><div class="toolbar"><input id="notifTitle" placeholder="عنوان الإشعار"><input id="notifBody" placeholder="نص الإشعار"><input id="notifArticle" placeholder="معرف الخبر اختياري"><button class="btn" onclick="addNotification()">+ إرسال إشعار</button></div><div id="notificationsTable"></div></div></section>
<section id="users" class="view hidden"><div class="panel"><div id="usersTable"></div></div></section><section id="categories" class="view hidden"><div class="panel"><button class="btn" onclick="addCategory()">+ تصنيف</button><div id="categoriesTable"></div></div></section><section id="sources" class="view hidden"><div class="panel"><button class="btn" onclick="addSource()">+ مصدر</button><div id="sourcesTable"></div></div></section>
</main></div>
<script>
const A='/api/admin';const $=id=>document.getElementById(id);let token=localStorage.getItem('nabdh_admin_token');let state={articles:[],users:[],categories:[],sources:[],videos:[],notifications:[]};
async function api(path,opts={}){opts.headers={...(opts.headers||{}),'Content-Type':'application/json',Authorization:'Bearer '+token};const r=await fetch(A+path,opts);const d=await r.json();if(!r.ok)throw Error(d.error||'حدث خطأ');return d}
async function adminLogin(){try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('pass').value})});const d=await r.json();if(!r.ok||d.user?.role!=='admin')throw Error(d.error||'بيانات المشرف غير صحيحة');token=d.token;localStorage.setItem('nabdh_admin_token',token);openApp()}catch(e){$('err').textContent=e.message}}
function logout(){localStorage.removeItem('nabdh_admin_token');location.reload()}
async function openApp(){$('loginScreen').style.display='none';$('app').style.display='block';try{await refresh();show('home')}catch(e){alert(e.message);logout()}}
async function refresh(){const [s,a,u,c,so,v,n]=await Promise.all([api('/stats'),api('/articles'),api('/users'),api('/categories'),api('/sources'),api('/videos'),api('/notifications')]);state={...state,...a,...u,...c,...so,...v,...n};$('cards').innerHTML=[['المستخدمون',s.users],['الأخبار',s.articles],['الفيديوهات',s.videos],['الإشعارات',s.notifications],['Premium',s.premiumUsers],['الإيرادات',s.revenue+' LYD']].map(x=>`<div class=card><div class=muted>${x[0]}</div><div class=num>${x[1]}</div></div>`).join('');renderAll()}
function show(id){document.querySelectorAll('.view').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.getElementById('title').textContent={home:'لوحة التحكم',articles:'إدارة الأخبار',videos:'إدارة الفيديوهات',notifications:'الإشعارات',users:'المستخدمون',categories:'التصنيفات',sources:'المصادر'}[id]}
function renderAll(){renderArticles();$('usersTable').innerHTML='<table><tr><th>الاسم</th><th>البريد</th><th>الدور</th><th>Premium</th><th></th></tr>'+state.users.map(u=>`<tr><td>${u.name}</td><td>${u.email}</td><td>${u.role}</td><td>${u.isPremium?'نعم':'لا'}</td><td><button class="btn small" onclick="togglePremium(${u.id},${!u.isPremium})">${u.isPremium?'إلغاء':'تفعيل'} Premium</button></td></tr>`).join('')+'</table>';$('categoriesTable').innerHTML='<table><tr><th>المعرف</th><th>الاسم</th><th>اللون</th><th></th></tr>'+state.categories.map(c=>`<tr><td>${c.id}</td><td>${c.name}</td><td>${c.color}</td><td><button class="btn red small" onclick="delCategory('${c.id}')">حذف</button></td></tr>`).join('')+'</table>';$('sourcesTable').innerHTML='<table><tr><th>المعرف</th><th>المصدر</th><th>النوع</th><th></th></tr>'+state.sources.map(s=>`<tr><td>${s.id}</td><td>${s.name}</td><td>${s.type}</td><td><button class="btn red small" onclick="delSource('${s.id}')">حذف</button></td></tr>`).join('')+'</table>';$('videosTable').innerHTML='<table><tr><th>الفيديو</th><th>الرابط</th><th>المصدر</th><th></th></tr>'+state.videos.map(v=>`<tr><td>${v.title}</td><td><a href="${v.url}" target="_blank">فتح</a></td><td>${v.source_name||''}</td><td><button class="btn red small" onclick="delVideo('${v.id}')">حذف</button></td></tr>`).join('')+'</table>';$('notificationsTable').innerHTML='<table><tr><th>العنوان</th><th>النص</th><th>الخبر</th><th></th></tr>'+state.notifications.map(n=>`<tr><td>${n.title}</td><td>${n.body}</td><td>${n.article_id||''}</td><td><button class="btn red small" onclick="delNotification('${n.id}')">حذف</button></td></tr>`).join('')+'</table>'}
function renderArticles(){let q=($('articleSearch')?.value||'').toLowerCase();let rows=state.articles.filter(a=>a.title.toLowerCase().includes(q));$('articlesTable').innerHTML='<table><tr><th>العنوان</th><th>التصنيف</th><th>عاجل</th><th>مميز</th><th></th></tr>'+rows.map(a=>`<tr><td>${a.title}</td><td>${a.category_name}</td><td>${a.isBreaking?'نعم':'لا'}</td><td>${a.isFeatured?'نعم':'لا'}</td><td><button class="btn small" onclick="editArticle('${a.id}')">تعديل</button> <button class="btn red small" onclick="delArticle('${a.id}')">حذف</button></td></tr>`).join('')+'</table>'}
async function togglePremium(id,v){await api('/users/'+id,{method:'PATCH',body:JSON.stringify({isPremium:v})});refresh()}async function delArticle(id){if(confirm('حذف الخبر؟')){await api('/articles/'+id,{method:'DELETE'});refresh()}}async function editArticle(id){let a=state.articles.find(x=>x.id===id);let title=prompt('العنوان',a.title);if(title){await api('/articles/'+id,{method:'PATCH',body:JSON.stringify({title})});refresh()}}async function addArticle(){let title=prompt('عنوان الخبر');if(!title)return;let categoryKey=prompt('معرف التصنيف',state.categories[0]?.id||'local');let categoryName=state.categories.find(c=>c.id===categoryKey)?.name||categoryKey;await api('/articles',{method:'POST',body:JSON.stringify({title,categoryKey,categoryName})});refresh()}
async function addVideo(){const title=$('videoTitle').value.trim(),url=$('videoUrl').value.trim();if(!title||!url)return alert('اكتب العنوان والرابط');await api('/videos',{method:'POST',body:JSON.stringify({title,url,description:$('videoDesc').value,thumbnailUrl:$('videoThumb').value,categoryKey:'video'})});$('videoTitle').value=$('videoUrl').value=$('videoDesc').value=$('videoThumb').value='';refresh()}async function delVideo(id){if(confirm('حذف الفيديو؟')){await api('/videos/'+id,{method:'DELETE'});refresh()}}async function addNotification(){const title=$('notifTitle').value.trim(),body=$('notifBody').value.trim();if(!title||!body)return alert('اكتب العنوان والنص');await api('/notifications',{method:'POST',body:JSON.stringify({title,body,articleId:$('notifArticle').value.trim()||null})});$('notifTitle').value=$('notifBody').value=$('notifArticle').value='';refresh()}async function delNotification(id){if(confirm('حذف الإشعار؟')){await api('/notifications/'+id,{method:'DELETE'});refresh()}}
async function addCategory(){let id=prompt('المعرف');let name=prompt('اسم التصنيف');if(id&&name){await api('/categories',{method:'POST',body:JSON.stringify({id,name})});refresh()}}async function delCategory(id){if(confirm('حذف التصنيف؟')){await api('/categories/'+id,{method:'DELETE'});refresh()}}async function addSource(){let id=prompt('المعرف');let name=prompt('اسم المصدر');if(id&&name){await api('/sources',{method:'POST',body:JSON.stringify({id,name})});refresh()}}async function delSource(id){if(confirm('حذف المصدر؟')){await api('/sources/'+id,{method:'DELETE'});refresh()}}
if(token)openApp();
</script></body></html>
